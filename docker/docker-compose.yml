version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ff_consumer}
      POSTGRES_USER: ${DB_USER:-ff_consumer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ff_consumer_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ff_consumer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: /app/docker/entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8001
    restart: unless-stopped
    volumes:
      - ..:/app
    ports:
      - "8001:8001"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ff_consumer}
      DB_USER: ${DB_USER:-ff_consumer}
      DB_PASSWORD: ${DB_PASSWORD:-ff_consumer_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${DB_USER:-ff_consumer}:${DB_PASSWORD:-ff_consumer_pass}@db:5432/${DB_NAME:-ff_consumer}
      ENGINE_BASE_URL: ${ENGINE_BASE_URL:-https://engine.flavorfind.co.ke}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      ENGINE_INTERNAL_KEY: ${ENGINE_INTERNAL_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config.celery worker --loglevel=info
    restart: unless-stopped
    volumes:
      - ..:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ff_consumer}
      DB_USER: ${DB_USER:-ff_consumer}
      DB_PASSWORD: ${DB_PASSWORD:-ff_consumer_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${DB_USER:-ff_consumer}:${DB_PASSWORD:-ff_consumer_pass}@db:5432/${DB_NAME:-ff_consumer}
      ENGINE_BASE_URL: ${ENGINE_BASE_URL:-https://engine.flavorfind.co.ke}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      ENGINE_INTERNAL_KEY: ${ENGINE_INTERNAL_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    volumes:
      - ..:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ff_consumer}
      DB_USER: ${DB_USER:-ff_consumer}
      DB_PASSWORD: ${DB_PASSWORD:-ff_consumer_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${DB_USER:-ff_consumer}:${DB_PASSWORD:-ff_consumer_pass}@db:5432/${DB_NAME:-ff_consumer}
      ENGINE_BASE_URL: ${ENGINE_BASE_URL:-https://engine.flavorfind.co.ke}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      ENGINE_INTERNAL_KEY: ${ENGINE_INTERNAL_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
