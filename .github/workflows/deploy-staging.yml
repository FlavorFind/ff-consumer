name: Deploy to Staging

# Deploys to the self-hosted Lenovo ThinkPad staging server via Tailscale + SSH.
# Gate: CI must pass before deploy runs (ci-gate calls ci.yml as a reusable workflow).
# Verify: smoke test runs on the server itself (avoids Cloudflare blocking GitHub IPs).
#
# Server: mayday@100.96.139.83 (Tailscale IP)
# Path:   /home/mayday/ff-consumer
# Port:   8001 (engine is on 8000)
# Service: ff-consumer (systemd)

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. CI gate — runs all lint/test/migration/schema jobs before deploy
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate (lint + tests + migrations + schema)
    uses: ./.github/workflows/ci.yml

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy + verify (runs on server via SSH — not affected by Cloudflare)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging server
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 300s
          script: |
            set -euo pipefail
            cd /home/mayday/ff-consumer

            echo "=== [1/6] Pull latest code ==="
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            echo "=== [2/6] Install/update dependencies ==="
            .venv/bin/pip install -q -r requirements/prod.txt --prefer-binary

            echo "=== [3/6] Run migrations ==="
            .venv/bin/python manage.py migrate --no-input

            echo "=== [4/6] Collect static files ==="
            .venv/bin/python manage.py collectstatic --no-input --clear

            echo "=== [5/6] Seed plans ==="
            .venv/bin/python manage.py seed_plans

            echo "=== [6/6] Reload Gunicorn ==="
            sudo systemctl reload ff-consumer || sudo systemctl restart ff-consumer
            sleep 3
            sudo systemctl is-active ff-consumer

            echo "=== Smoke test (local) ==="
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/v1/health/)
            echo "Health: $STATUS"
            [ "$STATUS" = "200" ] || exit 1

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/v1/meta/version/)
            echo "Version: $STATUS"
            [ "$STATUS" = "200" ] || exit 1

            echo "Deploy complete ✓"
