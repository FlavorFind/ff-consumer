name: Deploy to Staging

# DISABLED — self-hosted deploy via Tailscale/SSH not yet configured.
# Render auto-deploys from main. Re-enable this once the staging server
# SSH keys and Tailscale OAuth client are set in repo secrets.
on:
  workflow_dispatch:   # manual trigger only — never runs automatically

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to self-hosted staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/mayday/ff-consumer
            git fetch origin
            git checkout main
            git reset --hard origin/main
            .venv/bin/pip install -q -r requirements/prod.txt --prefer-binary
            .venv/bin/python manage.py migrate --no-input
            .venv/bin/python manage.py collectstatic --no-input
            .venv/bin/python manage.py seed_plans
            sudo systemctl reload gunicorn-ff-consumer || sudo systemctl restart gunicorn-ff-consumer
            echo "Deploy complete."

      - name: Smoke tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            BASE=http://localhost:8001
            curl -sf "$BASE/v1/health/" | grep '"status":"ok"'
            curl -sf "$BASE/v1/meta/version/" | grep '"consumer_version"'
            echo "Smoke tests passed."
